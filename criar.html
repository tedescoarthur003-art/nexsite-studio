<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar meu site - NexSite Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #07111f, #0b1f3a);
  color: white;
  min-height: 100vh;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  text-align: center;
  font-size: 38px;
  margin-bottom: 10px;
}

p {
  text-align: center;
  color: #b8c7d9;
}

.form {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    padding: 30px;
}
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #334b68;
  border-radius: 10px;
  background: #101f33;
  color: white;
  font-size: 16px;
transition: 0.3s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #00c6ff;
    box-shadow: 0 0 12px rgba(0,198,255,0.35);
    outline: none;
}
textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #007bff, #00c6ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,170,255,0.35);
}

#resultado {
  margin-top: 30px;
  padding: 30px;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  text-align: center;
}
</style>
<script>
  function gerarSite(){

  const empresa = document.getElementById("empresa").value;
  const titulo = document.getElementById("titulo").value;
  const descricao = document.getElementById("descricao").value;

  if(!empresa || !titulo){
    alert("Preencha o nome da empresa e o título.");
    return;
  }

  document.getElementById("rEmpresa").innerText = empresa;
document.getElementById("rTitulo").innerText = titulo;
document.getElementById("rDescricao").innerText = descricao;
  document.getElementById("resultado").style.display = "block";
}

function abrirWhatsApp(){

  const numero = document.getElementById("whatsapp").value;

  if(!numero){
    alert("Digite o número do WhatsApp.");
    return;
  }

  window.open("https://wa.me/" + numero, "_blank");
}
</script>
</body>
</html>
